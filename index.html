<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minko Interiors - Home</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Snipcart CSS/JS -->
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>

  <!-- Header/Footer injection -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- ✅ Snipcart div must be inside body -->
  <div hidden id="snipcart" data-api-key="OWRkYTk0NGQtMGFhZS00OGMwLWE1ZjctNzgyMGM3NmUzODNlNjM4OTg2NDkwODAzODYyNzUx"></div>

  <div id="site-header"></div>

  <main>
    <section class="hero">
      <h2>Beautiful Furniture for Modern Homes</h2>
      <p>Discover our curated collection of study tables, coffee tables, wardrobes, and more — crafted with care and available in multiple finishes.</p>
      <a href="products.html" class="btn">Shop Now</a>
    </section>

    <!-- Chair slot -->
    <section class="chair-slot">
      <h2 class="chair-title">Featured Chair</h2>
      <div id="chair-canvas"></div>
    </section>

    <!-- ✅ ES module script for Three.js -->
  <script type="module">
  import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
  import { GLTFLoader } from 'https://unpkg.com/three@0.126.1/examples/jsm/loaders/GLTFLoader.js';

  const container = document.getElementById("chair-canvas");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 1.5, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(3, 5, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 20;
  scene.add(dirLight);

  // Ground plane for shadows
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.5;
  ground.receiveShadow = true;
  scene.add(ground);

  // Load chair model and recenter pivot
  const loader = new GLTFLoader();
  let chair;
  loader.load("models/chair.glb", (gltf) => {
    const model = gltf.scene;
    model.scale.set(1, 1, 1);

    // Compute bounding box center
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // Wrap in pivot group
    const pivot = new THREE.Group();
    pivot.add(model);

    // Enable shadows
    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });

    scene.add(pivot);
    chair = pivot;
  }, undefined, (error) => {
    console.error("Error loading chair:", error);
  });

  // Target rotations
  let targetRotationX = 0;
  let targetRotationY = Math.PI; // showroom forward-facing

  // Cursor interaction
  container.addEventListener("mousemove", (e) => {
    if (chair) {
      const rect = container.getBoundingClientRect();
      const progressX = (e.clientX - rect.left) / rect.width;
      const progressY = (e.clientY - rect.top) / rect.height;

      targetRotationY = (progressX - 0.5) * Math.PI * 2;       // sideways spin
      targetRotationX = (progressY - 0.5) * (Math.PI / 2);     // tilt limited to ±45°
    }
  });

  // Reset smoothly when cursor leaves
  container.addEventListener("mouseleave", () => {
    targetRotationX = 0;
    targetRotationY = Math.PI; // showroom pose
  });

  // Floating animation clock
  const clock = new THREE.Clock();

  // Render loop with ease-out interpolation
  function animate() {
    requestAnimationFrame(animate);

    if (chair) {
      // Normalize Y rotation difference to avoid sudden spins
      let deltaY = targetRotationY - chair.rotation.y;
      deltaY = ((deltaY + Math.PI) % (2 * Math.PI)) - Math.PI;

      // Ease-out interpolation
      chair.rotation.y += deltaY * 0.08;
      chair.rotation.x += (targetRotationX - chair.rotation.x) * 0.08;

      // Gentle float
      const t = clock.getElapsedTime();
      chair.position.y = Math.sin(t * 2) * 0.1;
    }

    renderer.render(scene, camera);
  }
  animate();

  // Resize handling
  window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>

    
    
    
  </main>

  <div id="site-footer"></div>
</body>
</html>
