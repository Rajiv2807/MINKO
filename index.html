<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minko Interiors - Home</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Snipcart CSS/JS -->
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>

  <!-- Header/Footer injection -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- ✅ Snipcart div must be inside body -->
  <div hidden id="snipcart" data-api-key="OWRkYTk0NGQtMGFhZS00OGMwLWE1ZjctNzgyMGM3NmUzODNlNjM4OTg2NDkwODAzODYyNzUx"></div>

  <div id="site-header"></div>

  <main>
    <section class="hero">
      <h2>Beautiful Furniture for Modern Homes</h2>
      <p>Discover our curated collection of study tables, coffee tables, wardrobes, and more — crafted with care and available in multiple finishes.</p>
      <a href="products.html" class="btn">Shop Now</a>
    </section>

    <!-- Chair slot -->
    <section class="chair-slot">
      <h2 class="chair-title">Featured Chair</h2>
      <div id="chair-canvas"></div>
    </section>

    <!-- ✅ ES module script for Three.js -->
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.126.1/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.126.1/examples/jsm/loaders/GLTFLoader.js';

const container = document.getElementById('chair-canvas');

// Scene + camera
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(0, 2.6, 6);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.style.display = 'block';

// ensure container is clean and append renderer
while (container.firstChild) container.removeChild(container.firstChild);
container.appendChild(renderer.domElement);

// Resize helper: match renderer to CSS-driven container size
function resizeRendererToContainer() {
  const w = Math.max(1, container.clientWidth);
  const h = Math.max(1, container.clientHeight);
  const pr = renderer.getPixelRatio();
  if (renderer.domElement.width !== Math.floor(w * pr) ||
      renderer.domElement.height !== Math.floor(h * pr)) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}
resizeRendererToContainer();

// Lights
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(3, 5, 5);
dir.castShadow = true;
dir.shadow.mapSize.width = 1024;
dir.shadow.mapSize.height = 1024;
dir.shadow.camera.near = 0.5;
dir.shadow.camera.far = 30;
scene.add(dir);

// Ground shadow catcher
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.28 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// Loader + pivot setup
const loader = new GLTFLoader();
let pivotGroup = null;
let modelSize = new THREE.Vector3();

loader.load('models/chair.glb', (gltf) => {
  const model = gltf.scene;
  model.scale.set(1, 1, 1);

  // compute bounding box of the visible geometry
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());   // model size
  const center = box.getCenter(new THREE.Vector3()); // model center
  const min = box.min.clone();

  // SHIFT 1: move model so its bounding-box center is at origin (keeps rotations symmetric)
  model.position.sub(center);

  // SHIFT 2: remove any tiny negative min bias so feet rest on world y = 0
  const footOffset = - (min.y - center.y);
  model.position.y += footOffset;

  // Create pivot group and add model
  pivotGroup = new THREE.Group();
  pivotGroup.add(model);

  // Deterministic visual lift: align visual midpoint with canvas center
  const baseVisualLift = size.y * 0.65;
  let visualLift = baseVisualLift * 0.98; // tuned baseline

  // Additional small adjustment requested: bring down a bit and shift left
  visualLift = visualLift * 0.985; // bring down a further 1.5%
  const xShift = -0.09; // shift left in world units (negative X). Tweak if needed.

  pivotGroup.position.set(xShift, visualLift, 0);

  // Float: tiny amplitude, applied to child model only
  const floatAmplitude = size.y * 0.005; // 0.5% of height

  // Enable shadows on all meshes
  model.traverse((n) => {
    if (n.isMesh) {
      n.castShadow = true;
      n.receiveShadow = true;
      if (n.material) n.material.needsUpdate = true;
    }
  });

  scene.add(pivotGroup);

  // Camera framing: use model size to set distance and Y so chair sits centered in view
  const fovFactor = 1.8;
  const z = Math.max(5.5, size.y * fovFactor);
  const camY = visualLift + (size.y * 0.28);
  camera.position.set(center.x + xShift * 0.5, camY, z);
  camera.lookAt(xShift, visualLift, 0);

  // Iterative centering routine: nudges pivot until its screen projection is at canvas center
  function centerPivotInCanvas(pivotGroup, camera, container, iterations = 8, tolerancePx = 1) {
    camera.updateMatrixWorld(true);
    pivotGroup.updateWorldMatrix(true, true);

    const worldToScreen = (worldPos) => {
      const ndc = worldPos.clone().project(camera);
      const x = (ndc.x + 1) / 2 * container.clientWidth;
      const y = (1 - ndc.y) / 2 * container.clientHeight;
      return new THREE.Vector2(x, y);
    };

    const screenDeltaToWorldOffset = (dx, dy, pivotWorldPos) => {
      const ndcCenter = new THREE.Vector3((0.5 * 2) - 1, -(0.5 * 2) + 1, 0);
      ndcCenter.unproject(camera);
      const dirCenter = ndcCenter.sub(camera.position).normalize();

      const px = (((container.clientWidth / 2) + dx) / container.clientWidth) * 2 - 1;
      const py = -(((container.clientHeight / 2) + dy) / container.clientHeight) * 2 + 1;
      const ndcOffset = new THREE.Vector3(px, py, 0);
      ndcOffset.unproject(camera);
      const dirOffset = ndcOffset.sub(camera.position).normalize();

      const dist = camera.getWorldPosition(new THREE.Vector3()).distanceTo(pivotWorldPos);

      const worldCenter = camera.position.clone().add(dirCenter.multiplyScalar(dist));
      const worldOffset = camera.position.clone().add(dirOffset.multiplyScalar(dist));

      return worldOffset.sub(worldCenter);
    };

    for (let i = 0; i < iterations; i++) {
      camera.updateMatrixWorld(true);
      pivotGroup.updateWorldMatrix(true, true);

      const pivotWorld = pivotGroup.getWorldPosition(new THREE.Vector3());
      const screenPos = worldToScreen(pivotWorld);
      const centerPx = new THREE.Vector2(container.clientWidth / 2, container.clientHeight / 2);
      const delta = centerPx.clone().sub(screenPos);

      if (Math.abs(delta.x) <= tolerancePx && Math.abs(delta.y) <= tolerancePx) break;

      const worldOffset = screenDeltaToWorldOffset(delta.x, delta.y, pivotWorld);

      if (pivotGroup.parent) {
        const invParentMat = new THREE.Matrix4().copy(pivotGroup.parent.matrixWorld).invert();
        const localOffset = worldOffset.clone().applyMatrix4(invParentMat);
        pivotGroup.position.add(localOffset);
      } else {
        pivotGroup.position.add(worldOffset);
      }
    }

    camera.lookAt(pivotGroup.getWorldPosition(new THREE.Vector3()));
    camera.updateProjectionMatrix();
    pivotGroup.updateWorldMatrix(true, true);
  }

  // Run centering
  centerPivotInCanvas(pivotGroup, camera, container, 8, 1);

  // Expose for animate loop and debugging
  window._pivotGroup = pivotGroup;
  window._modelRef = model;
  window._modelSize = size;
  window._floatAmp = floatAmplitude;

  // Debug helpers (kept)
  console.log('box min', box.min, 'box max', box.max, 'size', size, 'center', center);
  console.log('visualLift', visualLift, 'floatAmp', floatAmplitude, 'xShift', xShift);

  // frustum-aligned orange frame (matches canvas view at pivot depth)
  {
    const pivotPosWorld = pivotGroup.getWorldPosition(new THREE.Vector3());
    const camWorldPos = camera.getWorldPosition(new THREE.Vector3());
    const dist = camWorldPos.distanceTo(pivotPosWorld);
    const fov = THREE.Math.degToRad(camera.fov);
    const heightAtDist = 2 * Math.tan(fov / 2) * dist;
    const widthAtDist = heightAtDist * (container.clientWidth / container.clientHeight);
    const frameGeo = new THREE.PlaneGeometry(widthAtDist, heightAtDist);
    const edges = new THREE.EdgesGeometry(frameGeo);
    const frameMat = new THREE.LineBasicMaterial({ color: 0xff9900 });
    const frameMesh = new THREE.LineSegments(edges, frameMat);
    frameMesh.position.copy(pivotPosWorld);
    frameMesh.position.add(new THREE.Vector3().copy(camera.getWorldDirection(new THREE.Vector3())).multiplyScalar(-0.01 * dist));
    frameMesh.quaternion.copy(camera.quaternion);
    scene.add(frameMesh);
    window._debugFrame = frameMesh;

    console.log('debugFrame width', widthAtDist, 'height', heightAtDist);
  }

  // pivot dot
  {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02), new THREE.MeshBasicMaterial({ color: 0xff9900 }));
    pivotGroup.updateWorldMatrix(true, true);
    dot.position.copy(pivotGroup.getWorldPosition(new THREE.Vector3()));
    scene.add(dot);
    window._pivotDot = dot;
    console.log('pivot world pos', pivotGroup.getWorldPosition(new THREE.Vector3()));
  }

  // Additional console projection check: pivot screen coords and container size
  {
    const p = pivotGroup.getWorldPosition(new THREE.Vector3());
    const ndc = p.clone().project(camera);
    const px = (ndc.x + 1) / 2 * container.clientWidth;
    const py = (1 - ndc.y) / 2 * container.clientHeight;
    console.log('pivot projected NDC', ndc, 'pivot screen px', { x: px, y: py });
    console.log('container size px', { w: container.clientWidth, h: container.clientHeight, aspect: container.clientWidth / container.clientHeight });
  }

  // -------------------------
  // QUICK MANUAL NUDGE (you requested a manual nudge)
  // These values move the visible model (not the pivot). Tweak small increments if needed.
  // Start with these and adjust by ±0.01 until visually centered.
  // -------------------------
  const manualNudge = { x: -0.06, y: -0.04 }; // left and down in model local units
  model.position.x += manualNudge.x;
  model.position.y += manualNudge.y;

  // update pivot dot and debug frame after manual nudge
  if (window._pivotDot) window._pivotDot.position.copy(pivotGroup.getWorldPosition(new THREE.Vector3()));
  if (window._debugFrame) {
    const pivotPosWorld = pivotGroup.getWorldPosition(new THREE.Vector3());
    const camWorldPos = camera.getWorldPosition(new THREE.Vector3());
    const dist = camWorldPos.distanceTo(pivotPosWorld);
    const fov = THREE.Math.degToRad(camera.fov);
    const heightAtDist = 2 * Math.tan(fov / 2) * dist;
    const widthAtDist = heightAtDist * (container.clientWidth / container.clientHeight);
    window._debugFrame.geometry.dispose();
    window._debugFrame.geometry = new THREE.EdgesGeometry(new THREE.PlaneGeometry(widthAtDist, heightAtDist));
    window._debugFrame.position.copy(pivotPosWorld);
    window._debugFrame.quaternion.copy(camera.quaternion);
  }

  // Log centroid before and after nudge for verification
  (function logCentroid() {
    const boxAfter = new THREE.Box3().setFromObject(model);
    const corners = [
      new THREE.Vector3(boxAfter.min.x, boxAfter.min.y, boxAfter.min.z),
      new THREE.Vector3(boxAfter.min.x, boxAfter.min.y, boxAfter.max.z),
      new THREE.Vector3(boxAfter.min.x, boxAfter.max.y, boxAfter.min.z),
      new THREE.Vector3(boxAfter.min.x, boxAfter.max.y, boxAfter.max.z),
      new THREE.Vector3(boxAfter.max.x, boxAfter.min.y, boxAfter.min.z),
      new THREE.Vector3(boxAfter.max.x, boxAfter.min.y, boxAfter.max.z),
      new THREE.Vector3(boxAfter.max.x, boxAfter.max.y, boxAfter.min.z),
      new THREE.Vector3(boxAfter.max.x, boxAfter.max.y, boxAfter.max.z),
    ];
    const worldCorners = corners.map(c => model.localToWorld(c.clone()));
    const screenPts = worldCorners.map(w => {
      const ndc = w.clone().project(camera);
      return new THREE.Vector2((ndc.x + 1) / 2 * container.clientWidth, (1 - ndc.y) / 2 * container.clientHeight);
    });
    const centroid = screenPts.reduce((a, p) => a.add(p), new THREE.Vector2(0,0)).multiplyScalar(1 / screenPts.length);
    const pivotWorld = pivotGroup.getWorldPosition(new THREE.Vector3());
    const pivotNDC = pivotWorld.clone().project(camera);
    const pivotScreen = { x: (pivotNDC.x + 1) / 2 * container.clientWidth, y: (1 - pivotNDC.y) / 2 * container.clientHeight };
    console.log('model centroid screen px (after nudge)', centroid, 'pivot screen px', pivotScreen, 'container center px', { x: container.clientWidth/2, y: container.clientHeight/2 });
  })();

}, undefined, (err) => {
  console.error('GLTF load error', err);
});

// Interaction targets
let targetRotationX = 0;
let targetRotationY = Math.PI;

// Pointer interaction (guard for container)
container.addEventListener('mousemove', (e) => {
  if (!window._pivotGroup) return;
  const rect = container.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const py = (e.clientY - rect.top) / rect.height;
  targetRotationY = (px - 0.5) * Math.PI * 2;
  targetRotationX = (py - 0.5) * (Math.PI / 2);
});

container.addEventListener('mouseleave', () => {
  targetRotationX = 0;
  targetRotationY = Math.PI;
});

// Clock + animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  // ensure renderer follows CSS box (handles layout shifts)
  resizeRendererToContainer();

  const pivot = window._pivotGroup;
  if (pivot) {
    // Normalize delta for Y to avoid long spins
    let deltaY = targetRotationY - pivot.rotation.y;
    deltaY = ((deltaY + Math.PI) % (2 * Math.PI)) - Math.PI;
    pivot.rotation.y += deltaY * 0.08;
    pivot.rotation.x += (targetRotationX - pivot.rotation.x) * 0.08;

    // Subtle float applied to the MODEL inside the pivot (not the pivot)
    const t = clock.getElapsedTime();
    const model = pivot.children[0];
    if (model) {
      model.position.y = Math.sin(t * 1.6) * (window._floatAmp || (modelSize.y * 0.005));
    }
  }

  renderer.render(scene, camera);
}
animate();

// Responsive
window.addEventListener('resize', () => {
  resizeRendererToContainer();

  // update debug frame size/position on resize if present
  if (window._debugFrame && window._pivotGroup) {
    const pivotPosWorld = window._pivotGroup.getWorldPosition(new THREE.Vector3());
    const camWorldPos = camera.getWorldPosition(new THREE.Vector3());
    const dist = camWorldPos.distanceTo(pivotPosWorld);
    const fov = THREE.Math.degToRad(camera.fov);
    const heightAtDist = 2 * Math.tan(fov / 2) * dist;
    const widthAtDist = heightAtDist * (container.clientWidth / container.clientHeight);
    window._debugFrame.geometry.dispose();
    window._debugFrame.geometry = new THREE.EdgesGeometry(new THREE.PlaneGeometry(widthAtDist, heightAtDist));
    window._debugFrame.position.copy(pivotPosWorld);
    window._debugFrame.quaternion.copy(camera.quaternion);
  }
  if (window._pivotDot && window._pivotGroup) {
    window._pivotDot.position.copy(window._pivotGroup.getWorldPosition(new THREE.Vector3()));
  }
});
</script>

    
    
  </main>

  <div id="site-footer"></div>
</body>
