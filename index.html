<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minko Interiors</title>

  <!-- Site styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header placeholder (will be injected or filled by script.js if needed) -->
  <div id="site-header" role="banner"></div>

  <!-- Hero / Intro -->
  <main>
    <section class="hero" id="hero" aria-label="Hero">
      <div class="hero-inner">
        <h1 class="hero-title">Minko Interiors</h1>
        <p class="hero-sub">Curated furniture, crafted for living spaces.</p>
      </div>
    </section>

    <!-- Chair viewer slot -->
    <section class="chair-slot" aria-label="Featured chair">
      <div class="chair-title">Featured Chair</div>
      <div id="chair-canvas" role="img" aria-label="3D chair viewer"></div>
    </section>
  </main>

  <!-- Footer placeholder (will be injected or filled by script.js if needed) -->
  <div id="site-footer" role="contentinfo"></div>

  <!-- Your app script (module) -->
  <script type="module" src="script.js"></script>
</body>
</html>
