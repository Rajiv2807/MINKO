<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - Minko Interiors</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Snipcart CSS -->
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>
  <div hidden id="snipcart" data-api-key="OWRkYTk0NGQtMGFhZS00OGMwLWE1ZjctNzgyMGM3NmUzODNlNjM4OTg2NDkwODAzODYyNzUx"></div>

  <!-- Custom JS -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1><a href="index.html" class="logo">Minko</a></h1>
    <nav>
      <a href="products.html">Furniture</a>
      <a href="home-interior.html">Home Interior</a>
      <a href="contact.html">Contact</a>
      <a href="#" class="snipcart-checkout">Cart</a>
    </nav>
  </header>

  <!-- Body -->
  <main>
    <div class="products-grid">

      <!-- Example Product: Study Table 1 -->
      <div class="product">
        <img src="assets/study-table-1-walnut.jpg" alt="Study Table 1" class="product-image" id="study-table-1-img">
        <h3>Study Table 1</h3>
        <p>₹6,499</p>
        <div class="color-options">
          <span class="color-swatch walnut" onclick="updateProductImage('study-table-1-img','assets/study-table-1-walnut.jpg')"></span>
          <span class="color-swatch wenge" onclick="updateProductImage('study-table-1-img','assets/study-table-1-wenge.jpg')"></span>
          <span class="color-swatch white" onclick="updateProductImage('study-table-1-img','assets/study-table-1-white.jpg')"></span>
        </div>
        <button class="snipcart-add-item"
          data-item-id="study-table-1"
          data-item-name="Study Table 1"
          data-item-price="6499"
          data-item-url="/products.html"
          data-item-description="Minimal Study Table Model 1 with customizable finishes">
          Add to Cart
        </button>
      </div>

      <!-- Repeat for Study Table 2, Coffee Table, Bedside Table, Shoe Rack, Book Shelf, Wardrobe -->
      <!-- Each product has one listing + swatches for Walnut, Wenge, White -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Minko Interiors. All rights reserved.</p>
    <nav class="footer-nav">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>
</body>
</html>
