<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - Minko Interiors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Our Furniture</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="#" class="snipcart-checkout">Cart</a>
    </nav>
  </header>

  <main>
    <div class="product">
      <img src="assets/table.jpg" alt="Wooden Table">
      <h3>Minimal Wooden Table</h3>
      <p>₹4,999</p>
      <button
        class="snipcart-add-item"
        data-item-id="table01"
        data-item-name="Minimal Wooden Table"
        data-item-price="4999"
        data-item-url="/products.html"
        data-item-description="Handcrafted wooden table for minimal interiors">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <img src="assets/shoerack.jpg" alt="Shoe Rack">
      <h3>Compact Shoe Rack</h3>
      <p>₹2,499</p>
      <button
        class="snipcart-add-item"
        data-item-id="shoerack01"
        data-item-name="Compact Shoe Rack"
        data-item-price="2499"
        data-item-url="/products.html"
        data-item-description="Minimalistic shoe rack for modern homes">
        Add to Cart
      </button>
    </div>

    <!-- Add mandir, wardrobe similarly -->
  </main>
</body>
</html>
